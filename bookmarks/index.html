<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuiter Bookmarks</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Bookmarks</h1>
            <h2>@WebDev</h2>
        </header>
        
        <!-- Example Bookmark -->
        <div class="bookmark mb-4 p-3">
            <div class="d-flex align-items-start">
                <img src="../assets/avatar.svg" alt="User Avatar" width="48" height="48" class="rounded-circle mr-3">
                <div class="bookmark-content">
                    <p><strong>User Name</strong> <span>@username</span></p>
                    <p>This is a saved bookmark. Bookmark content goes here. This can be a tuit, article, or post.</p>
                    <div class="actions">
                        <a href="#"><i class="fas fa-reply"></i> Reply</a>
                        <a href="#"><i class="fas fa-retweet"></i> Retuit</a>
                        <a href="#"><i class="fas fa-heart"></i> Like</a>
                        <a href="#"><i class="fas fa-share"></i> Share</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Repeat for more bookmarks -->
    </div>
</body>
</html>
