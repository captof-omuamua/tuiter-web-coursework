<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Tuiter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .banner, .avatar {
            display: block;
            margin-bottom: 10px;
        }
        .banner {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }
        .input-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Back button to the profile screen -->
    <a href="profile.html">Back</a>
    
    <!-- Tuiter and Edit Profile headers -->
    <h1>Tuiter</h1>
    <h2>Edit Profile</h2>

    <!-- Save link to navigate back to profile page -->
    <a href="profile.html">Save</a>

    <!-- Banner image and file input for updating banner -->
    <img src="assets/banner.svg" alt="Banner Image" class="banner">
    <input type="file" accept="image/*" class="input-group">

    <!-- Avatar image and file input for updating avatar -->
    <img src="assets/avatar.svg" alt="Avatar Image" class="avatar">
    <input type="file" accept="image/*" class="input-group">

    <!-- Horizontal line separator -->
    <hr>

    <!-- Name input field with label -->
    <div class="input-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Name" value="WebDev">
    </div>

    <!-- Horizontal line separator -->
    <hr>

    <!-- Bio textarea with label -->
    <div class="input-group">
        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio" rows="10" cols="50" placeholder="Bio">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam tincidunt arcu vel sem facilisis, a facilisis nisl cursus. Donec efficitur tortor sed felis fermentum, a accumsan justo tincidunt.</textarea>
    </div>
</body>
</html>
