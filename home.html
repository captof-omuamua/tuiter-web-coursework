<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuiter Home</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="container mt-4">
    <a href="navigation.html" class="btn btn-secondary mb-3">Back</a>
    
    <header class="mb-4">
        <h1>Tuiter</h1>
        <h2>Home</h2>
    </header>

   
    <div class="mb-4 p-3 bg-light rounded">
        <div class="d-flex align-items-start">
            <img src="assets/avatar.svg" alt="Owner" width="48" height="48" class="rounded-circle me-3">
            <textarea class="form-control" placeholder="What's happening?" rows="3"></textarea>
        </div>
        <div class="mt-3">
            <select class="form-select">
                <option value="EVERYONE">Everyone can reply</option>
                <option value="FOLLOWING">People you follow</option>
                <option value="MENTIONED">Only people you mention</option>
            </select>
            <div class="mt-3">
                <button class="btn btn-secondary">Upload Image</button>
                <button class="btn btn-primary">Tuit</button>
            </div>
        </div>
    </div>

  
    <ul class="list-unstyled">
        <li class="mb-4 p-3 bg-white rounded border">
            <div class="d-flex align-items-start">
                <img src="assets/avatar.svg" alt="User" width="48" height="48" class="rounded-circle me-3">
                <div>
                    <a href="profile.html" class="fw-bold">Tony Stark</a> 
                    <span class="text-muted">@yourhandle</span> · 
                    <time class="text-muted">2 hours ago</time>
                    <p>Dummy content for the tuit goes here.</p>
                   
                    <div class="d-flex">
                        <a href="reply.html" class="me-3"><i class="fas fa-reply"></i> Reply (123)</a>
                        <a href="retuit.html" class="me-3"><i class="fas fa-retweet"></i> Retuit (234)</a>
                        <a href="like.html" class="me-3"><i class="fas fa-heart"></i> Like (345)</a>
                        <a href="share.html"><i class="fas fa-share"></i> Share</a>
                    </div>
                </div>
            </div>
        </li>

        
    </ul>

   
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
